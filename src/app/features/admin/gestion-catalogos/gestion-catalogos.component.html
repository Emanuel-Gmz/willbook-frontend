<div class="container py-5">
  <h2 class="fw-bold text-primary mb-4">Administración de Autores y Categorías</h2>

  <div class="row g-4">
    <!-- Sección Autores -->
    <div class="col-md-6">
      <div class="card shadow-sm border-0 p-4 h-100">
        <h4 class="fw-bold text-dark mb-3">Registrar Nuevo Autor</h4>
        <form (ngSubmit)="crearAutor()" #autorForm="ngForm">
          <div class="mb-3">
            <label class="form-label fw-semibold">Nombre</label>
            <input type="text" class="form-control" [(ngModel)]="nuevoAutor.nombre" name="nombre" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Apellido</label>
            <input type="text" class="form-control" [(ngModel)]="nuevoAutor.apellido" name="apellido" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">País de Origen</label>
            <input type="text" class="form-control" [(ngModel)]="nuevoAutor.paisOrigen" name="paisOrigen">
          </div>
          <button type="submit" class="btn btn-primary fw-bold w-100" [disabled]="!autorForm.valid">Guardar Autor</button>
        </form>
      </div>
    </div>

    <!-- Sección Categorías -->
    <div class="col-md-6">
      <div class="card shadow-sm border-0 p-4 h-100">
        <h4 class="fw-bold text-dark mb-3">Registrar Nueva Categoría</h4>
        <form (ngSubmit)="crearCategoria()" #catForm="ngForm">
          <div class="mb-3">
            <label class="form-label fw-semibold">Nombre de la Categoría</label>
            <input type="text" class="form-control" [(ngModel)]="nuevaCategoria.nombre" name="nombreCat" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Descripción</label>
            <textarea class="form-control" [(ngModel)]="nuevaCategoria.descripcion" name="descCat" rows="3"></textarea>
          </div>
          <button type="submit" class="btn btn-primary fw-bold w-100" [disabled]="!catForm.valid">Guardar Categoría</button>
        </form>
      </div>
    </div>
  </div>
</div>
